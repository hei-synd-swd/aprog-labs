[package]
name = "minibus"
version = "0.1.0"
edition = "2024"

[dependencies]

# Curated pedantic clippy lints, set to "warn": the `just lint` gate
# (`clippy -- -D warnings`) escalates them to hard errors.
[lints.clippy]
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
manual_let_else = "warn"
redundant_else = "warn"
map_unwrap_or = "warn"
unnested_or_patterns = "warn"