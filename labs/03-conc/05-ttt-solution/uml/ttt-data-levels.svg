<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:775px;height:757px;background:#FFFFFF;" width="775px" height="757px" viewBox="0 0 775 757" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="17"><text x="255.002" y="24.533" fill="#000" font-size="14" textLength="257.995" font-weight="700">ttt — the same message at three levels</text><text x="145.925" y="42.143" fill="#000" font-size="14" textLength="476.15" font-weight="700">left: a player asks to play cell 5 · right: the server pushes the new board</text></g><!--cluster L1--><g class="cluster" data-qualified-name="L1" id="ent0001" data-source-line="19"><rect x="7" y="63.219" width="612" height="181.67" fill="#FFF" style="stroke:#90A4AE;stroke-width:1;" rx="2.5" ry="2.5"/><text x="98.051" y="79.752" fill="#455A64" font-size="14" textLength="124.893" font-weight="700">1 — APPLICATION</text><text x="234.612" y="79.752" fill="#455A64" font-size="14" textLength="293.337" font-weight="700">a value in memory, checked by the compiler</text></g><!--cluster L2--><g class="cluster" data-qualified-name="L2" id="ent0005" data-source-line="42"><rect x="12" y="311.889" width="661" height="120.49" fill="#FFF" style="stroke:#90A4AE;stroke-width:1;" rx="2.5" ry="2.5"/><text x="103.546" y="329.092" fill="#455A64" font-size="14" textLength="130.32" font-weight="700">2 — WIRE FORMAT</text><text x="245.536" y="329.092" fill="#455A64" font-size="14" textLength="196.834" font-weight="700">one line of text per message (</text><text x="442.37" y="327.964" fill="#455A64" font-size="14" textLength="134.422" font-weight="700" font-family="monospace">core/src/wire.rs</text><text x="576.792" y="329.092" fill="#455A64" font-size="14" font-weight="700">)</text></g><!--cluster L3--><g class="cluster" data-qualified-name="L3" id="ent0009" data-source-line="57"><rect x="9" y="499.379" width="752" height="155.39" fill="#FFF" style="stroke:#90A4AE;stroke-width:1;" rx="2.5" ry="2.5"/><text x="207.813" y="515.912" fill="#455A64" font-size="14" textLength="58.003" font-weight="700">3 — TCP</text><text x="277.484" y="515.912" fill="#455A64" font-size="14" textLength="284.703" font-weight="700">one long stream of bytes, and nothing else</text></g><!--entity app_req--><g class="entity" data-qualified-name="L1.app_req" id="ent0002" data-source-line="20"><rect x="23.18" y="99.219" width="301.647" height="129.666" fill="#E8F4FD" style="stroke:#2196F3;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="124.392" y="116.752" fill="#1565C0" font-size="14" textLength="99.224" font-weight="700">client -> server</text><line x1="24.18" y1="119.828" x2="323.827" y2="119.828" style="stroke:#2196F3;stroke-width:1;"/><line x1="24.18" y1="121.828" x2="323.827" y2="121.828" style="stroke:#2196F3;stroke-width:1;"/><text x="106.793" y="137.903" fill="#1565C0" font-size="14" textLength="134.422" font-family="monospace">Request::Move(5)</text><line x1="24.18" y1="146.107" x2="323.827" y2="146.107" style="stroke:#2196F3;stroke-width:1;"/><text x="68.177" y="164.641" fill="#1565C0" font-size="14" textLength="211.654">An enum value: which variant it is,</text><text x="87.006" y="182.92" fill="#1565C0" font-size="14" textLength="144.751">plus its payload (here a</text><text x="235.647" y="181.792" fill="#1565C0" font-size="14" textLength="16.803" font-family="monospace">u8</text><text x="252.45" y="182.92" fill="#1565C0" font-size="14" textLength="8.552">).</text><text x="61.142" y="200.529" fill="#1565C0" font-size="14" textLength="225.723">You cannot build a nonsense one —</text><text x="33.18" y="217.681" fill="#1565C0" font-size="14" textLength="168.027" font-family="monospace">Request::Move(hello)</text><text x="205.097" y="218.809" fill="#1565C0" font-size="14" textLength="109.73">does not compile.</text></g><!--entity app_upd--><g class="entity" data-qualified-name="L1.app_upd" id="ent0003" data-source-line="30"><rect x="369.48" y="108.019" width="233.049" height="112.057" fill="#E8F4FD" style="stroke:#2196F3;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="436.393" y="125.552" fill="#1565C0" font-size="14" textLength="99.224" font-weight="700">server -> client</text><line x1="370.48" y1="128.628" x2="601.529" y2="128.628" style="stroke:#2196F3;stroke-width:1;"/><line x1="370.48" y1="130.628" x2="601.529" y2="130.628" style="stroke:#2196F3;stroke-width:1;"/><text x="401.991" y="146.703" fill="#1565C0" font-size="14" textLength="168.027" font-family="monospace">Update::Board(cells)</text><line x1="370.48" y1="154.907" x2="601.529" y2="154.907" style="stroke:#2196F3;stroke-width:1;"/><text x="379.48" y="174.111" fill="#1565C0" font-size="14" textLength="158.751">An enum value carrying a</text><text x="542.121" y="172.983" fill="#1565C0" font-size="14" textLength="50.408" font-family="monospace">String</text><text x="414.029" y="191.72" fill="#1565C0" font-size="14" textLength="143.951">of exactly 9 characters:</text><text x="448.198" y="208.871" fill="#1565C0" font-size="14" textLength="75.612" font-family="monospace">X2O456789</text></g><!--entity wire_req--><g class="entity" data-qualified-name="L2.wire_req" id="ent0006" data-source-line="43"><rect x="28.04" y="348.889" width="279.93" height="67.498" fill="#E8F4FD" style="stroke:#2196F3;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="134.399" y="365.964" fill="#1565C0" font-size="14" textLength="67.211" font-family="monospace">MOVE 5\n</text><line x1="29.04" y1="370.168" x2="306.97" y2="370.168" style="stroke:#2196F3;stroke-width:1;"/><text x="65.285" y="388.701" fill="#1565C0" font-size="14" textLength="205.44">A verb, a space, the argument —</text><text x="38.04" y="406.311" fill="#1565C0" font-size="14" textLength="259.93">then the newline that ENDS the message.</text></g><!--entity wire_upd--><g class="entity" data-qualified-name="L2.wire_upd" id="ent0007" data-source-line="49"><rect x="352.59" y="357.689" width="304.826" height="49.889" fill="#E8F4FD" style="stroke:#2196F3;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="433.591" y="374.764" fill="#1565C0" font-size="14" textLength="142.823" font-family="monospace">STATE X2O456789\n</text><line x1="353.59" y1="378.968" x2="656.416" y2="378.968" style="stroke:#2196F3;stroke-width:1;"/><text x="362.59" y="397.501" fill="#1565C0" font-size="14" textLength="284.826">Same shape: verb, space, argument, newline.</text></g><!--entity tcp_req--><g class="entity" data-qualified-name="L3.tcp_req" id="ent0010" data-source-line="58"><rect x="24.79" y="535.379" width="260.427" height="103.387" fill="#E8F4FD" style="stroke:#2196F3;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="70.99" y="552.454" fill="#1565C0" font-size="14" textLength="168.027" font-family="monospace">4D 4F 56 45 20 35 0A</text><text x="79.391" y="570.733" fill="#1565C0" font-size="14" textLength="159.626" font-family="monospace">M  O  V  E sp  5 \n</text><line x1="25.79" y1="574.937" x2="284.217" y2="574.937" style="stroke:#2196F3;stroke-width:1;"/><text x="48.39" y="593.471" fill="#1565C0" font-size="14" textLength="52.138" font-weight="700">7 bytes.</text><text x="104.417" y="593.471" fill="#1565C0" font-size="14" textLength="157.199">TCP has no idea that this</text><text x="34.79" y="611.08" fill="#1565C0" font-size="14" textLength="240.427">is a message. It carries bytes, in order,</text><text x="80.293" y="628.689" fill="#1565C0" font-size="14" textLength="149.42">and that is its whole job.</text></g><!--entity tcp_upd--><g class="entity" data-qualified-name="L3.tcp_upd" id="ent0011" data-source-line="66"><rect x="330.57" y="544.189" width="414.864" height="85.777" fill="#E8F4FD" style="stroke:#2196F3;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="340.57" y="561.264" fill="#1565C0" font-size="14" textLength="394.864" font-family="monospace">53 54 41 54 45 20 58 32 4F 34 35 36 37 38 39 0A</text><text x="348.971" y="579.543" fill="#1565C0" font-size="14" textLength="386.463" font-family="monospace">S  T  A  T  E sp  X  2  O  4  5  6  7  8  9 \n</text><line x1="331.57" y1="583.747" x2="744.434" y2="583.747" style="stroke:#2196F3;stroke-width:1;"/><text x="413.882" y="602.281" fill="#1565C0" font-size="14" textLength="59.924" font-weight="700">16 bytes.</text><text x="477.695" y="602.281" fill="#1565C0" font-size="14" textLength="184.427">Six for the verb and its space,</text><text x="418.144" y="619.89" fill="#1565C0" font-size="14" textLength="239.716">nine for the board, one for the newline.</text></g><!--link app_req to app_upd--><!--link wire_req to wire_upd--><!--link tcp_req to tcp_upd--><!--link app_req to wire_req--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk13" data-source-line="76" data-link-type="dependency"><path d="M172.22,229.149 C171.14,268.319 169.939,311.801 169.059,343.431" style="stroke:#000;stroke-width:1;" fill="none" id="app_req-to-wire_req" codeLine="76"/><polygon points="168.92,348.429,173.169,339.543,169.059,343.431,165.172,339.321,168.92,348.429" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="172.18" y="274.959" fill="#000" font-size="13" textLength="187.23" font-family="monospace">encode_request(&amp;request)</text><text x="219.184" y="292.357" fill="#000" font-size="13" textLength="93.222">builds the String</text></g><!--link wire_req to tcp_req--><g class="link" data-entity-1="ent0006" data-entity-2="ent0010" id="lnk14" data-source-line="77" data-link-type="dependency"><path d="M165.88,416.609 C163.82,448.649 160.99,492.789 158.61,529.909" style="stroke:#000;stroke-width:1;" fill="none" id="wire_req-to-tcp_req" codeLine="77"/><polygon points="158.29,534.899,162.858,526.173,158.61,529.909,154.874,525.661,158.29,534.899" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="164.8" y="462.449" fill="#000" font-size="13" textLength="210.634" font-family="monospace">write_all(frame.as_bytes())</text><text x="196.773" y="479.847" fill="#000" font-size="13" textLength="146.688">the String becomes bytes</text></g><!--reverse link wire_upd to tcp_upd--><g class="link" data-entity-1="ent0007" data-entity-2="ent0011" id="lnk16" data-source-line="79" data-link-type="dependency"><path d="M509.785,412.984 C515.275,446.644 524.43,502.829 531.13,543.949" style="stroke:#000;stroke-width:1;" fill="none" id="wire_upd-backto-tcp_upd" codeLine="79"/><polygon points="508.98,408.049,506.481,417.575,509.785,412.984,514.377,416.287,508.98,408.049" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="542.708" y="462.449" fill="#000" font-size="13" textLength="140.423" font-family="monospace">BufReader::lines()</text><text x="521.51" y="479.847" fill="#000" font-size="13" textLength="182.819">cuts the stream at each newline</text></g><!--reverse link app_upd to wire_upd--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" id="lnk18" data-source-line="80" data-link-type="dependency"><path d="M491.307,225.53 C495.177,269.64 499.97,324.259 502.86,357.199" style="stroke:#000;stroke-width:1;" fill="none" id="app_upd-backto-wire_upd" codeLine="80"/><polygon points="490.87,220.549,487.672,229.864,491.307,225.53,495.641,229.165,490.87,220.549" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="499.32" y="274.959" fill="#000" font-size="13" textLength="156.025" font-family="monospace">decode_update(&amp;line)</text><text x="498.2" y="292.357" fill="#000" font-size="13" textLength="158.266">text becomes a value again</text></g><g class="legend" data-source-line="82"><rect x="58.309" y="674.769" width="651.382" height="63.498" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="82.04" y="694.302" fill="#000" font-size="14" textLength="37.358">Going</text><text x="123.288" y="694.302" fill="#000" font-size="14" textLength="36.545" font-weight="700">down</text><text x="163.722" y="694.302" fill="#000" font-size="14" textLength="112.861">is encoding, going</text><text x="280.473" y="694.302" fill="#000" font-size="14" textLength="17.104" font-weight="700">up</text><text x="301.466" y="694.302" fill="#000" font-size="14" textLength="384.494">is decoding — and each direction does both, one at each end.</text><text x="89.846" y="711.911" fill="#000" font-size="14" textLength="588.308">Only level 2 ever deals in text: above it everything is a typed value, below it everything is bytes.</text><text x="63.309" y="729.063" fill="#000" font-size="14" textLength="16.803" font-family="monospace">sp</text><text x="84.001" y="730.191" fill="#000" font-size="14" textLength="207.778">is the space character (0x20) and</text><text x="295.669" y="729.063" fill="#000" font-size="14" textLength="16.803" font-family="monospace">\n</text><text x="316.362" y="730.191" fill="#000" font-size="14" textLength="388.329">the newline (0x0A) — the two bytes you cannot see on screen.</text></g><?plantuml-src TLR_RXf74FwVfnXTf0XJx63Wi8tQIDZ1aQKujcoIfaeYQxaRkAkNtSlkdZ6gAlKX-Yxzlu_I9-dCxXq_70UXWvjRPh_lcszciVUvAeGH2x2PIFKoLtEO2McnOTTFHiRevPcMsi1KYkH-wv7IALeie1zl1OrGznoCjuCfpaGftGGVtKZcSxL0vI2X2vhjdsBYX9fBX3yQ0AUqsTpeKgLXzsMME-IuDYcQ47jnqXdrHsEAdclbgbW_ZaU3VkFFhSo9CEcpIL-CZy_xvs-UfkqUdWpEUxjf3-D1VDQXj0sNEyBed8F__leRN8PWnG9XWTQAEO9m53E88F41fVsY9CxS40GKKgpGWB3t5fpsjoI2b133l_-0oUSPBVFfq3pGmgAq6LeVKRY4gIOMZSP6fQZLElGGHjVNxoxEHfEBg_Uj5W1jzI1aYP0h0hNGPjM69CFa7bEOhdo-H2-ANAA920syE_JQU954KTmP_0QVAT1g9JBdIks_hY2rMXJ-XLxq4KKt-Ar4wuR3I_s0pNWlYYYyJo_w62b0LIu2a24NBydenkI2ykNqjcrQLSZIqfs5Ggoa5YaqCpIa82KlZwDexu3M_APBWgQKTZ0jSqaGoNZA8hr1AsG1da6JaQwQ446gIKB-SKMPKtxTPbiMQSMsaftO1jwxR3yKgN0u79vo6PfSD_jZnfpUhBYVcCkjC_JLBzOpm4UHEBc24oeAkJEX9h13lyMdxbK_7XmTd_YbZB8kn_xdB4zJL5-zI_PhuEp67JzqlHz-lRWPm_dLpULeult0CicSBhIxenw4WcZMTcr6KQ8Dlh8cURNC3HuOIye7OtGtnk17QsT4qUNLnp74Ft_ugTE9prwh